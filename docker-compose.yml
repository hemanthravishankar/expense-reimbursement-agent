name: expense-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_agent_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-expense_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-expense_agent} -d ${POSTGRES_DB:-expense_agent}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-expense_agent}:${POSTGRES_PASSWORD:-expense_agent_dev_password}@postgres:5432/${POSTGRES_DB:-expense_agent}?sslmode=disable

      # Recommended on macOS/Apple Silicon:
      # keep Ollama on the host so it can use native Metal acceleration.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - expense_data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  expense_data:
